<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ポスター掲示板管理</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="/style.css">
</head>
<body class="map-page">
<header id="header">
  <div class="header-row header-row-controls">
    <select id="assignee-filter"></select>
    <div class="status-filter" id="status-filter"></div>
    <div class="header-actions">
      <button id="gps-button" type="button" title="現在地">📍</button>
      <button id="menu-button" type="button" title="メニュー">&#8801;</button>
    </div>
  </div>
  <div class="header-row header-row-stats" id="header-stats">
    <span>掲示板数: <strong id="stat-total">0</strong></span>
    <span>貼付済: <strong id="stat-posted">0</strong>(<span id="stat-posted-rate">0.0%</span>)</span>
    <span>トラブル: <strong id="stat-trouble">0</strong></span>
  </div>
  <div class="header-toggle-hint" aria-hidden="true"></div>
  <div id="menu-panel">
    <a href="/history.html" class="menu-link">履歴一覧</a>
    <a href="/boards.html" class="menu-link">掲示板マスタ一覧</a>
    <a href="/users.html" id="users-link" class="menu-link" style="display:none;">ユーザー管理</a>
    <button id="logout-button" type="button">ログアウト</button>
  </div>
</header>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/config.js"></script>
<script src="/app.js"></script>
</body>
</html>
